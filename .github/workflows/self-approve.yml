name: self-approve-probe
on:
  push:
    branches: [bp-src]
permissions:
  contents: write
  pull-requests: write
jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: approve PR with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review 1 --approve --body "probe approval by workflow token" 2>&1 || echo "APPROVE_FAILED"
          gh pr view 1 --json reviewDecision,reviews -q '"REVIEW_DECISION=\(.reviewDecision) REVIEWS=\([.reviews[].author.login+":"+.state]|join(","))"'
      - name: merge PR with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge 1 --merge 2>&1 && echo "MERGE_OK" || echo "MERGE_DENIED"
