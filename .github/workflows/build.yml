name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage output
        run: |
          mkdir -p out/scripts
          cp scripts/post.sh out/scripts/post.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: out/
